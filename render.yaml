services:
  - type: web
    name: cranvila-waffle
    runtime: node
    region: oregon
    rootDir: .            # repo root (not backend/)
    buildCommand: npm run render-build
    startCommand: node backend/server.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: ADMIN_KEY
        sync: false        # set in the dashboard
      - key: ALLOW_DEMO_PAYMENTS
        value: "true"      # remove once Razorpay keys are set
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
